<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Course access – DevAI Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0f14;
      --panel: #121820;
      --line: #26303c;
      --text: #e6edf3;
      --mute: #8b98a7;
      --green: #3fb950;
      --blue: #58a6ff;
      --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
      --sans: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, #1b2430 1px, transparent 0);
      background-size: 28px 28px;
      font-family: var(--sans);
    }
    main {
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 24px 60px rgb(0 0 0 / 35%);
    }
    .logo {
      color: var(--text);
      font: 800 18px var(--mono);
      text-decoration: none;
    }
    .logo span, .tag { color: var(--green); }
    .tag {
      display: block;
      margin-top: 36px;
      font: 13px var(--mono);
    }
    h1 {
      margin: 10px 0;
      font: 800 clamp(25px, 6vw, 32px)/1.2 var(--mono);
      letter-spacing: -.03em;
    }
    p { color: var(--mute); line-height: 1.6; }
    label {
      display: block;
      margin: 26px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font: 15px var(--sans);
    }
    input:focus-visible, a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 12px 16px;
      border: 1px solid var(--green);
      border-radius: 6px;
      background: var(--green);
      color: #04130a;
      cursor: pointer;
      font: 600 14px var(--mono);
    }
    .note {
      margin: 16px 0 0;
      font-size: 12px;
    }
    .back {
      display: inline-block;
      margin-top: 24px;
      color: var(--mute);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/">DevAI<span>_</span>Academy</a>
    <span class="tag">// course access</span>
    <h1>Password required</h1>
    <p>Enter the course password to continue.</p>
    <form id="password-form">
      <label for="course-password">Course password</label>
      <input id="course-password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      <button type="submit">Continue</button>
    </form>
    <p class="note" id="form-status" role="status" aria-live="polite">Password checking is not configured on this page.</p>
    <a class="back" href="/">← Back to DevAI Academy</a>
  </main>
  <script>
    document.getElementById("password-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("form-status").textContent =
        "Password verification is not configured. No password was sent or checked.";
    });
  </script>
</body>
</html>
